<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2; /* FIXED: added missing colon after property name */
        }

        .student-title {
            text-align: center;
            color: darkblue;
        }

        /* FIXED: added # symbol so this correctly targets the form's id */
        #studentForm {
            width: 450px;
            border: 2px solid black;
            padding: 20px;   /* FIXED: removed extra space before colon */
            margin: 20px auto;
        }

        .input-box {
            margin-bottom: 12px;
        }

        #resultBox {
            width: 450px;
            border: 1px solid green;
            padding: 15px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

<h1 class="student-title">Student Registration Form</h1> <!-- FIXED: was id, changed to class to match CSS -->

<form id="studentForm">

    <div class="input-box">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" required> <!-- FIXED: id spelling + added required -->
    </div>

    <div class="input-box">
        <label for="email">Email:</label>
        <input type="email" id="email" required> <!-- FIXED: type text -> email + added required -->
    </div>

    <div class="input-box">
        <label for="mobile">Mobile Number:</label>
        <input type="number" id="mobile">
    </div>

    <div class="input-box">
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob"> <!-- FIXED: type text -> date -->
    </div>

    <div class="input-box">
        <label for="course">Course:</label>

        <select id="course" required> <!-- FIXED: added required -->
            <option value="">Select Course</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="BTech">B.Tech</option>
        </select>
    </div>

    <div class="input-box">
        <label>Expertise:</label>

        <input type="checkbox" id="html" value="HTML"> HTML
        <input type="checkbox" id="css" value="CSS"> CSS
        <input type="checkbox" id="js" value="JavaScript"> JavaScript
    </div>

    <button type="button" onclick="showStudent()"> <!-- FIXED: submit -> button, wrong function name -> showStudent() -->
        Register Student
    </button>

</form>

<div id="resultBox">
    Registration information will appear here.
</div>

<script>

function showStudent() {

    var name =
        document.getElementById("studentName").value; // FIXED: id spelling

    let email =
        document.getElementById("email").value;

    const mobile =
        document.getElementById("mobile").value;

    let dob =
        document.getElementById("dob").value;

    var course =
        document.getElementById("course").value;

    // FIXED: && changed to || so it stops if EITHER field is empty
    if (name == "" || email == "" || course == "") {
        alert("Student Name, Email and Course are required");
        return;
    }

    // ADDED: email format check
    var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        alert("Please enter a valid email address");
        return;
    }

    // ADDED: mobile number check
    var mobilePattern = /^[9876]\d{9}$/;

    if (!mobilePattern.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number starting with 9, 8, 7 or 6");
        return;
    }

    // FIXED: now handles Cancel (null) properly
    var semester =
        prompt("Enter Current Semester");

    if (semester == null) {
        alert("Registration cancelled. Semester not provided.");
        return;
    }

    if (semester.trim() == "") {
        alert("Semester not entered. Registration stopped.");
        return;
    }

    // ADDED: semester range check, limit depends on course
    var semesterNum = Number(semester);
    var maxSemester = (course == "MCA") ? 12 : 8;

    if (isNaN(semesterNum) || semesterNum < 1 || semesterNum > maxSemester) {
        alert("Please enter a valid semester between 1 and " + maxSemester + " for " + course);
        return;
    }

    // ADDED: expertise checkboxes now read using DOM
    var expertise = [];

    if (document.getElementById("html").checked) {
        expertise.push("HTML");
    }
    if (document.getElementById("css").checked) {
        expertise.push("CSS");
    }
    if (document.getElementById("js").checked) {
        expertise.push("JavaScript");
    }

    if (expertise.length == 0) {
        alert("Please select at least one expertise");
        return;
    }

    // FIXED: confirm message + logic corrected
    var choice =
        confirm("Do you want to submit the registration?");

    if (choice == false) {
        alert("Registration cancelled by user");
        return;
    }

    // FIXED: wrong id "result" -> "resultBox", innerHtml -> innerHTML
    document.getElementById("resultBox").innerHTML =
        "<h2>Student Information</h2>" +
        "Name: " + name +
        "<br>Email: " + email +
        "<br>Mobile: " + mobile +
        "<br>DOB: " + dob +
        "<br>Course: " + course +
        "<br>Semester: " + semester +
        "<br>Expertise: " + expertise.join(", ");

    alert("Registration successful");

}

</script>

</body>
</html>

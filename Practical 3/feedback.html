<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub - Feedback</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  

  <header>
    <div class="logo">StudentHub</div>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="attendance.html">Attendance</a></li>
        <li><a href="notices.html">Notices</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="admin.html">Admin</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="feedback.html" aria-current="page">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section aria-labelledby="feedback-title">
      <h1 id="feedback-title">Student Feedback</h1>
      <p>Your suggestions help improve the portal experience.</p>

      <form action="feedback.html" method="get">
        <label for="name">Name</label>
        <input id="name" type="text" name="name" required>

        <label for="email">Email</label>
        <input id="email" type="email" name="email" required>

        <label for="rating">Overall Rating</label>
        <select id="rating" name="rating">
          <option value="5">Excellent</option>
          <option value="4">Good</option>
          <option value="3">Average</option>
          <option value="2">Poor</option>
          <option value="1">Very Poor</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Submit Feedback</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; <span data-year></span> StudentHub | CHARUSAT</p>
  </footer>

    
</body>
</html>

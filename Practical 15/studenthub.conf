# Practical 15: Apache Virtual Host Configuration for Local Deployment
# Place this file in /etc/apache2/sites-available/studenthub.conf (Linux)
# or in /Applications/XAMPP/etc/extra/httpd-vhosts.conf (XAMPP macOS)

<VirtualHost *:80>
    ServerAdmin webmaster@studenthub.local
    ServerName studenthub.local
    ServerAlias www.studenthub.local

    # Root pointing to the StudentHub unified portal
    DocumentRoot "/Users/bhavygol/Downloads/sp/Practical 15"

    <Directory "/Users/bhavygol/Downloads/sp/Practical 15">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Directory Aliases for seamless access to all module practicals
    Alias /practical12 "/Users/bhavygol/Downloads/sp/Practical 12"
    <Directory "/Users/bhavygol/Downloads/sp/Practical 12">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /practical13 "/Users/bhavygol/Downloads/sp/Practical 13"
    <Directory "/Users/bhavygol/Downloads/sp/Practical 13">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /practical14 "/Users/bhavygol/Downloads/sp/Practical 14"
    <Directory "/Users/bhavygol/Downloads/sp/Practical 14">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Custom Logging
    ErrorLog "/var/log/apache2/studenthub_error.log"
    CustomLog "/var/log/apache2/studenthub_access.log" combined
</VirtualHost>
